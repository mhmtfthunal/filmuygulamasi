<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Detayı - FilmApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color: #000;">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span style="color: #e50914; font-size: 1.5rem; font-weight: 900; letter-spacing: 1px;">FILMAPP</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="favorites.html">Favorilerim</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="movie-detail-container row">
            <!-- Sol: Afiş -->
            <div class="col-md-4 mb-3">
                <img id="movie-image" src="" class="img-fluid rounded shadow-lg w-100" alt="Film Afişi">
            </div>
            
            <!-- Sağ: Bilgiler -->
            <div class="col-md-8">
                <h1 id="movie-title" class="display-5 mb-3">Yükleniyor...</h1>
                
                <div class="d-flex gap-3 mb-3 text-secondary">
                    <span><strong class="text-white">Kategori:</strong> <span id="movie-category">-</span></span>
                    <span><strong class="text-white">Süre:</strong> <span id="movie-duration">-</span></span>
                    <span class="badge-imdb text-dark">IMDB <span id="movie-imdb">-</span></span>
                </div>

                <p id="movie-desc" class="lead mb-4">Film açıklaması yükleniyor...</p>

                <button id="fav-btn" class="btn btn-outline-danger btn-lg mb-4">
                    Favorilere Ekle
                </button>

                <!-- Fragman -->
                <h4 class="mt-4">Fragman</h4>
                <div class="video-container">
                    <iframe id="movie-trailer" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Film İzleme Uygulaması. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
